<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Hany — cloud security and detection engineering</title>
  <desc id="d">A signal pulse travels from logs through detection and response and ends in an incident report.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262D"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0B0F15" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0B0F15" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0B0F15" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity="0"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0.9"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .pulse { animation: travel 3.6s cubic-bezier(.45,0,.25,1) infinite; }
    .alert { animation: alert 3.6s ease-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      8% { opacity: 1; }
      78% { transform: translateX(356px); opacity: 1; }
      84%, 100% { transform: translateX(356px); opacity: 0; }
    }
    @keyframes alert {
      0%, 76% { stroke-opacity: .35; fill-opacity: .06; }
      82% { stroke-opacity: 1; fill-opacity: .22; }
      100% { stroke-opacity: .35; fill-opacity: .06; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .alert, .cursor { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0B0F15"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="760" height="300" fill="url(#fade)"/>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="none" stroke="#21262D" stroke-width="2"/>

  <!-- identity -->
  <text x="64" y="104" class="mono" font-size="20" fill="#7AA2F7">$ whoami<tspan class="cursor" fill="#C0CAF5"> ▍</tspan></text>
  <text x="62" y="172" class="sans" font-size="60" font-weight="700" fill="#E6EDF3" letter-spacing="-1.5">Ahmed Hany</text>
  <text x="64" y="216" class="sans" font-size="24" fill="#8B949E">Cloud security · Detection engineering · AWS</text>

  <!-- pipeline: CloudTrail → EventBridge → Lambda → S3 incident -->
  <line x1="704" y1="138" x2="1060" y2="138" stroke="#30363D" stroke-width="2"/>
  <g class="pulse">
    <rect x="644" y="137" width="60" height="2" fill="url(#trail)"/>
    <circle cx="704" cy="138" r="5" fill="#7AA2F7"/>
  </g>

  <g class="mono" font-size="14" text-anchor="middle">
    <rect x="672" y="106" width="64" height="64" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <path d="M690 126h28M690 138h28M690 150h18" stroke="#7AA2F7" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <text x="704" y="200" fill="#8B949E">logs</text>

    <rect x="790" y="106" width="64" height="64" rx="14" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    <path d="M806 138h10l4-10 8 20 4-10h10" stroke="#7AA2F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="822" y="200" fill="#8B949E">detect</text>

    <rect x="908" y="106" width="64" height="64" rx="14" fill="#161B22" stroke="#7AA2F7" stroke-width="2"/>
    <path d="M928 154l9-20-4-8h7l12 28" stroke="#7AA2F7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="940" y="200" fill="#8B949E">respond</text>

    <rect class="alert" x="1028" y="106" width="64" height="64" rx="14" fill="#FF9E64" stroke="#FF9E64" stroke-width="2"/>
    <path d="M1060 124l14 25h-28z" stroke="#FF9E64" stroke-width="2.4" stroke-linejoin="round" fill="none"/>
    <path d="M1060 133v7M1060 144v.5" stroke="#FF9E64" stroke-width="2.4" stroke-linecap="round"/>
    <text x="1060" y="200" fill="#FF9E64">report</text>
  </g>
</svg>
