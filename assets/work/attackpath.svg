<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="719" viewBox="0 0 1200 719" role="img" aria-labelledby="t">
  <title id="t">AWS Cloud Attack Path Analyzer run on its synthetic demo account: 49 findings, 4 of them critical, including a one-step path from a user to an admin role</title>
  <defs>
    <clipPath id="win"><rect x="1" y="1" width="1198" height="717" rx="15"/></clipPath>
  </defs>
  <style>.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }</style>
  <g clip-path="url(#win)">
    <rect width="1200" height="719" fill="#0D1117"/>
    <g class="mono" font-size="23" fill="#C9D1D9" xml:space="preserve">
      <text x="48" y="104"><tspan x="48" fill="#7AA2F7">$ python -m attackpath analyze \</tspan></text>
      <text x="48" y="147"><tspan x="48" fill="#7AA2F7">    --input fixtures/sample_environment.json --output reports/</tspan></text>
      <text x="48" y="190"><tspan x="48" fill="#C9D1D9">environment: synthetic-demo-account (synthetic, account 111111111111)</tspan></text>
      <text x="48" y="233"><tspan x="48" fill="#C9D1D9">findings: </tspan><tspan fill="#FF9E64">critical=4</tspan><tspan fill="#C9D1D9">, high=22, medium=11, low=8, informational=4</tspan></text>
      <text x="48" y="298"><tspan x="48" fill="#FF9E64" font-weight="700">CRITICAL</tspan><tspan x="182" fill="#C9D1D9">Instance legacy-jump is reachable from the internet on all ports</tspan></text>
      <text x="48" y="341"><tspan x="48" fill="#FF9E64" font-weight="700">CRITICAL</tspan><tspan x="182" fill="#C9D1D9">User legacy-automation can reach role ops-admin-legacy in 1 step(s)</tspan></text>
      <text x="48" y="384"><tspan x="48" fill="#FF9E64" font-weight="700">CRITICAL</tspan><tspan x="182" fill="#C9D1D9">Role vendor-support-access can be assumed by any AWS principal</tspan></text>
      <text x="48" y="427"><tspan x="48" fill="#FF9E64" font-weight="700">CRITICAL</tspan><tspan x="182" fill="#C9D1D9">Role ops-admin-legacy has administrative permissions</tspan></text>
      <text x="48" y="470"><tspan x="48" fill="#E0AF68" font-weight="700">HIGH</tspan><tspan x="182" fill="#C9D1D9">User legacy-automation may assume any role matching a broad pattern</tspan></text>
      <text x="48" y="513"><tspan x="48" fill="#E0AF68" font-weight="700">HIGH</tspan><tspan x="182" fill="#C9D1D9">User break-glass-admin has administrative permissions</tspan></text>
      <text x="48" y="556"><tspan x="48" fill="#E0AF68" font-weight="700">HIGH</tspan><tspan x="182" fill="#C9D1D9">User ci-deployer may pass any role to AWS services</tspan></text>
      <text x="48" y="599"><tspan x="48" fill="#E0AF68" font-weight="700">HIGH</tspan><tspan x="182" fill="#C9D1D9">Function public-webhook can be invoked by anyone</tspan></text>
      <text x="48" y="642"><tspan x="48" fill="#6E7681">... 41 more</tspan></text>
    </g>
    <rect width="1200" height="44" fill="#161B22"/>
    <line x1="0" y1="44" x2="1200" y2="44" stroke="#30363D" stroke-width="2"/>
    <circle cx="30" cy="22" r="6.5" fill="#3D444D"/>
    <circle cx="52" cy="22" r="6.5" fill="#3D444D"/>
    <circle cx="74" cy="22" r="6.5" fill="#3D444D"/>
    <text x="600" y="27" class="mono" font-size="15" fill="#9198A1" text-anchor="middle">attackpath</text>
  </g>
  <rect x="1" y="1" width="1198" height="717" rx="15" fill="none" stroke="#30363D" stroke-width="2"/>
</svg>
