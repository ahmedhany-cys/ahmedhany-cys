<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Hany, cloud security engineer</title>
  <desc id="d">Detection and response on AWS, Azure and Kubernetes. A graph traces one path from a token through a role and a workload to the data it can reach.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151D"/>
      <stop offset="1" stop-color="#0B0F15"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#222A35"/>
    </pattern>
    <linearGradient id="reveal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.42" stop-color="#000"/>
      <stop offset="0.78" stop-color="#fff"/>
    </linearGradient>
    <mask id="right"><rect width="1200" height="340" fill="url(#reveal)"/></mask>
    <radialGradient id="glow" cx="1082" cy="122" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AA2F7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="338" rx="20"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    @media (prefers-reduced-motion: reduce) { .motion { display: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#dots)" mask="url(#right)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="20" fill="none" stroke="#30363D" stroke-width="2"/>

  <!-- identity -->
  <rect x="64" y="85" width="28" height="2" rx="1" fill="#7AA2F7"/>
  <text x="106" y="91" class="mono" font-size="14" font-weight="600" letter-spacing="2.6" fill="#7AA2F7">CLOUD SECURITY ENGINEER</text>
  <text x="61" y="168" class="sans" font-size="70" font-weight="700" letter-spacing="-2.2" fill="#F0F6FC">Ahmed Hany</text>
  <text x="64" y="214" class="sans" font-size="22" fill="#9198A1">Detection and response on AWS, Azure and Kubernetes</text>
  <text x="64" y="272" class="mono" font-size="14" fill="#6E7681">evidence first, never a guess</text>

  <!-- graph: every edge is a permission; one path reaches the data -->
  <g stroke="#2A313C" stroke-width="1.5">
    <line x1="716" y1="70" x2="836" y2="122"/>
    <line x1="716" y1="70" x2="956" y2="70"/>
    <line x1="716" y1="204" x2="836" y2="270"/>
    <line x1="836" y1="270" x2="956" y2="204"/>
    <line x1="836" y1="122" x2="956" y2="70"/>
    <line x1="956" y1="70" x2="1082" y2="122"/>
    <line x1="956" y1="204" x2="1082" y2="270"/>
    <line x1="836" y1="270" x2="1082" y2="270"/>
    <line x1="1082" y1="122" x2="1146" y2="204"/>
    <line x1="1082" y1="270" x2="1146" y2="204"/>
  </g>
  <g fill="#0D1117" stroke="#3D444D" stroke-width="1.5">
    <circle cx="716" cy="70" r="6"/>
    <circle cx="836" cy="270" r="6"/>
    <circle cx="956" cy="70" r="6"/>
    <circle cx="1082" cy="270" r="6"/>
    <circle cx="1146" cy="204" r="6"/>
  </g>
  <path id="route" d="M716 204 L836 122 L956 204 L1082 122" fill="none" stroke="#7AA2F7" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.75"/>
  <g>
    <circle cx="716" cy="204" r="10" fill="#0D1117" stroke="#7AA2F7" stroke-width="2"/>
    <circle cx="716" cy="204" r="3.5" fill="#7AA2F7"/>
    <circle cx="836" cy="122" r="10" fill="#0D1117" stroke="#7AA2F7" stroke-width="2"/>
    <circle cx="836" cy="122" r="3.5" fill="#7AA2F7"/>
    <circle cx="956" cy="204" r="10" fill="#0D1117" stroke="#7AA2F7" stroke-width="2"/>
    <circle cx="956" cy="204" r="3.5" fill="#7AA2F7"/>
  </g>
  <circle class="motion" cx="1082" cy="122" r="12" fill="none" stroke="#FF9E64" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="4.2s" repeatCount="indefinite" values="12;12;30" keyTimes="0;0.7;1"/>
    <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="0;0.85;0" keyTimes="0;0.7;1"/>
  </circle>
  <circle cx="1082" cy="122" r="11" fill="#0D1117" stroke="#FF9E64" stroke-width="2"/>
  <circle cx="1082" cy="122" r="4" fill="#FF9E64"/>
  <circle class="motion" r="5" fill="#7AA2F7" opacity="0">
    <animateMotion dur="4.2s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.7;1">
      <mpath href="#route"/>
    </animateMotion>
    <animate attributeName="opacity" dur="4.2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.06;0.66;0.7;1"/>
  </circle>

  <g class="mono" font-size="13" text-anchor="middle" fill="#9198A1">
    <text x="716" y="236">token</text>
    <text x="836" y="100">role</text>
    <text x="956" y="236">workload</text>
    <text x="1082" y="98" fill="#FF9E64" font-weight="600">data</text>
  </g>
</svg>
