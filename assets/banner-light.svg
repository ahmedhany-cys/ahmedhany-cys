<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Ahmed Hany, cloud security engineer</title>
  <desc id="d">Detection and response engineering on AWS, Azure and Kubernetes. A network graph lights up one path, from a token through a role, a workload and a secret to the data it can reach.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1D55"/>
      <stop offset="0.55" stop-color="#1741B0"/>
      <stop offset="1" stop-color="#0D2470"/>
    </linearGradient>
    <radialGradient id="ga" cx="860" cy="170" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6CB0FF" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#6CB0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gb" cx="1110" cy="206" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gc" cx="90" cy="400" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FD4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7FD4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="reveal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.30" stop-color="#000"/>
      <stop offset="0.72" stop-color="#fff"/>
    </linearGradient>
    <mask id="right"><rect width="1200" height="380" fill="url(#reveal)"/></mask>
    <linearGradient id="heat" x1="668" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="0.55" stop-color="#8FA6F2"/>
      <stop offset="0.8" stop-color="#FFB37A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.35" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4D8FF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="378" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .flow { stroke-dasharray: 2 30; animation: flow 1.5s linear infinite; }
    .tw { animation: tw 5s ease-in-out infinite; }
    .tw:nth-child(3n) { animation-delay: -1.6s; }
    .tw:nth-child(3n+1) { animation-delay: -3.3s; }
    .live { animation: live 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @keyframes tw { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes live { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .tw, .live { animation: none; }
      .motion { display: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#base)"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#right)"/>
    <rect width="1200" height="380" fill="url(#ga)"/>
    <rect width="1200" height="380" fill="url(#gc)"/>
    <rect width="1200" height="380" fill="url(#gb)"/>
  </g>
  <rect x="1" y="1" width="1198" height="378" rx="24" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- graph: every edge is a permission -->
  <g stroke="#B8C7E6" stroke-opacity="0.32" stroke-width="1.2">
    <line x1="640" y1="112" x2="790" y2="152"/>
    <line x1="722" y1="60" x2="790" y2="152"/>
    <line x1="722" y1="60" x2="852" y2="62"/>
    <line x1="852" y1="62" x2="790" y2="152"/>
    <line x1="852" y1="62" x2="1004" y2="130"/>
    <line x1="852" y1="62" x2="950" y2="34"/>
    <line x1="950" y1="34" x2="1062" y2="56"/>
    <line x1="668" y1="252" x2="640" y2="112"/>
    <line x1="668" y1="252" x2="760" y2="322"/>
    <line x1="760" y1="322" x2="882" y2="332"/>
    <line x1="760" y1="322" x2="900" y2="238"/>
    <line x1="882" y1="332" x2="900" y2="238"/>
    <line x1="882" y1="332" x2="992" y2="302"/>
    <line x1="992" y1="302" x2="900" y2="238"/>
    <line x1="992" y1="302" x2="1092" y2="320"/>
    <line x1="992" y1="302" x2="1110" y2="206"/>
    <line x1="1092" y1="320" x2="1110" y2="206"/>
    <line x1="1092" y1="320" x2="1168" y2="284"/>
    <line x1="1110" y1="206" x2="1168" y2="284"/>
    <line x1="1110" y1="206" x2="1152" y2="112"/>
    <line x1="1152" y1="112" x2="1062" y2="56"/>
    <line x1="1062" y1="56" x2="1004" y2="130"/>
  </g>
  <g fill="#0E2466" stroke="#B8C7E6" stroke-opacity="0.70" stroke-width="1.4">
    <circle class="tw" cx="640" cy="112" r="4.5"/>
    <circle class="tw" cx="722" cy="60" r="4.5"/>
    <circle class="tw" cx="852" cy="62" r="4.5"/>
    <circle class="tw" cx="760" cy="322" r="4.5"/>
    <circle class="tw" cx="882" cy="332" r="4.5"/>
    <circle class="tw" cx="992" cy="302" r="4.5"/>
    <circle class="tw" cx="1092" cy="320" r="4.5"/>
    <circle class="tw" cx="1152" cy="112" r="4.5"/>
    <circle class="tw" cx="1062" cy="56" r="4.5"/>
    <circle class="tw" cx="1168" cy="284" r="4.5"/>
    <circle class="tw" cx="950" cy="34" r="4.5"/>
  </g>

  <!-- the one path that reaches the data, cold to hot -->
  <path d="M668 252 L790 152 L900 238 L1004 130 L1110 206" fill="none" stroke="url(#heat)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.75" filter="url(#soft)"/>
  <path id="route" d="M668 252 L790 152 L900 238 L1004 130 L1110 206" fill="none" stroke="url(#heat)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <path class="flow" d="M668 252 L790 152 L900 238 L1004 130 L1110 206" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <g>
    <circle cx="668" cy="252" r="22" fill="#4DA3FF" opacity="0.16"/>
    <circle cx="668" cy="252" r="12" fill="#0E2466" stroke="#4DA3FF" stroke-width="2.5"/>
    <circle cx="668" cy="252" r="4.5" fill="#4DA3FF"/>
    <circle cx="790" cy="152" r="22" fill="#63A2FB" opacity="0.16"/>
    <circle cx="790" cy="152" r="12" fill="#0E2466" stroke="#63A2FB" stroke-width="2.5"/>
    <circle cx="790" cy="152" r="4.5" fill="#63A2FB"/>
    <circle cx="900" cy="238" r="22" fill="#8FA6F2" opacity="0.16"/>
    <circle cx="900" cy="238" r="12" fill="#0E2466" stroke="#8FA6F2" stroke-width="2.5"/>
    <circle cx="900" cy="238" r="4.5" fill="#8FA6F2"/>
    <circle cx="1004" cy="130" r="22" fill="#FFB37A" opacity="0.16"/>
    <circle cx="1004" cy="130" r="12" fill="#0E2466" stroke="#FFB37A" stroke-width="2.5"/>
    <circle cx="1004" cy="130" r="4.5" fill="#FFB37A"/>
  </g>

  <!-- target -->
  <circle cx="1110" cy="206" r="36" fill="#FF8A3D" opacity="0.20"/>
  <circle class="motion" cx="1110" cy="206" r="14" fill="none" stroke="#FF8A3D" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="2.6s" repeatCount="indefinite" values="14;46"/>
    <animate attributeName="opacity" dur="2.6s" repeatCount="indefinite" values="0.9;0"/>
  </circle>
  <circle class="motion" cx="1110" cy="206" r="14" fill="none" stroke="#FFB37A" stroke-width="2" opacity="0">
    <animate attributeName="r" dur="2.6s" begin="1.3s" repeatCount="indefinite" values="14;46"/>
    <animate attributeName="opacity" dur="2.6s" begin="1.3s" repeatCount="indefinite" values="0.9;0"/>
  </circle>
  <circle cx="1110" cy="206" r="15" fill="#0E2466" stroke="#FF8A3D" stroke-width="3"/>
  <circle cx="1110" cy="206" r="6" fill="#FF8A3D"/>

  <!-- comet -->
  <g class="motion" opacity="0">
    <circle r="11" fill="#FFFFFF" opacity="0.25"/>
    <circle r="5.5" fill="#FFFFFF"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.8;1">
      <mpath href="#route"/>
    </animateMotion>
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.05;0.74;0.8;1"/>
  </g>

  <g class="mono" font-size="13.5" text-anchor="middle" fill="#C9D8FF">
    <text x="668" y="290">token</text>
    <text x="790" y="124">role</text>
    <text x="900" y="276">workload</text>
    <text x="1004" y="102">secret</text>
    <text x="1110" y="172" fill="#FFB37A" font-weight="700" font-size="15">data</text>
  </g>

  <!-- identity -->
  <rect x="64" y="56" width="288" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.30"/>
  <circle class="live" cx="84" cy="73" r="4.5" fill="#4ADE80"/>
  <text x="100" y="78" class="mono" font-size="13" font-weight="600" letter-spacing="2.2" fill="#DCE6FF">CLOUD SECURITY ENGINEER</text>

  <text x="60" y="182" class="sans" font-size="88" font-weight="800" letter-spacing="-3" fill="url(#name)">Ahmed Hany</text>
  <text x="64" y="228" class="sans" font-size="25" fill="#DCE6FF">Detection and response engineering</text>

  <g class="sans" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="64" y="252" width="74" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <text x="101" y="276">AWS</text>
    <rect x="148" y="252" width="86" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <text x="191" y="276">Azure</text>
    <rect x="244" y="252" width="132" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.30"/>
    <text x="310" y="276">Kubernetes</text>
  </g>

  <text x="64" y="334" class="mono" font-size="14.5" fill="#C9D8FF"><tspan fill="#FFB37A">//</tspan> evidence first, never a guess</text>
</svg>
