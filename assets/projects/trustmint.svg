<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="t">
  <title id="t">TrustMint scan of the synthetic Acme estate: 20 federation trusts ranked by who can mint a token each identity accepts</title>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262D"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect width="960" height="540" fill="#0B0F15"/>
  <rect width="960" height="540" fill="url(#grid)"/>

  <!-- terminal window -->
  <rect x="40" y="40" width="880" height="460" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <path d="M40 54a14 14 0 0 1 14-14h852a14 14 0 0 1 14 14v26H40z" fill="#161B22"/>
  <line x1="40" y1="80" x2="920" y2="80" stroke="#30363D" stroke-width="2"/>
  <circle cx="68" cy="60" r="6" fill="#30363D"/>
  <circle cx="88" cy="60" r="6" fill="#30363D"/>
  <circle cx="108" cy="60" r="6" fill="#30363D"/>
  <text x="480" y="65" class="mono" font-size="14" fill="#8B949E" text-anchor="middle">trustmint</text>

  <g class="mono" font-size="16" fill="#C0CAF5">
    <text x="68" y="118" fill="#7AA2F7">$ trustmint scan -s examples/acme/snapshot.json</text>
    <text x="68" y="146">TrustMint 0.1.0: 20 federation trusts</text>
    <text x="68" y="172">Findings: <tspan fill="#FF9E64">11 critical</tspan>, 7 high, 3 medium, 1 low, 4 info</text>

    <text x="68" y="214" fill="#8B949E">WHO CAN MINT A TOKEN EACH IDENTITY ACCEPTS</text>

    <g font-size="15">
      <text y="246"><tspan x="68" fill="#FF9E64" font-weight="700">PUBLIC</tspan><tspan x="196">role/gh-release-main</tspan><tspan x="480" fill="#8B949E">aws</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">github</tspan><tspan x="704" fill="#8B949E">write</tspan></text>
      <text y="274"><tspan x="68" fill="#FF9E64" font-weight="700">PUBLIC</tspan><tspan x="196">projects/acme-artifacts</tspan><tspan x="480" fill="#8B949E">gcp</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">gitlab</tspan><tspan x="704" fill="#8B949E">write</tspan></text>
      <text y="302"><tspan x="68" fill="#E0AF68" font-weight="700">TENANT</tspan><tspan x="196">role/gh-org-admin</tspan><tspan x="480" fill="#8B949E">aws</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">github</tspan><tspan x="704" fill="#8B949E">admin</tspan></text>
      <text y="330"><tspan x="68" fill="#E0AF68" font-weight="700">TENANT</tspan><tspan x="196">platform-automation</tspan><tspan x="480" fill="#8B949E">azure</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">github</tspan><tspan x="704" fill="#8B949E">admin</tspan></text>
      <text y="358"><tspan x="68" fill="#7AA2F7" font-weight="700">PROJECT</tspan><tspan x="196">role/tfc-prod-network</tspan><tspan x="480" fill="#8B949E">aws</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">terraform</tspan><tspan x="704" fill="#8B949E">admin</tspan></text>
      <text y="386"><tspan x="68" fill="#9ECE6A" font-weight="700">PROTECTED</tspan><tspan x="196">role/gh-payments-immutable</tspan><tspan x="480" fill="#8B949E">aws</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">github</tspan><tspan x="704" fill="#8B949E">write</tspan></text>
      <text y="414"><tspan x="68" fill="#565F89" font-weight="700">NONE</tspan><tspan x="196">role/gh-web-broken</tspan><tspan x="480" fill="#8B949E">aws</tspan><tspan x="548" fill="#565F89">&lt;-</tspan><tspan x="584">github</tspan><tspan x="704" fill="#8B949E">write</tspan></text>
    </g>

    <text x="68" y="460" font-size="13" fill="#565F89">Synthetic Acme estate from examples/acme. Every account, project and ID is made up.</text>
  </g>
</svg>
