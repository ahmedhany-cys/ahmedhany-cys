# Redraws assets/achievements.svg from the public achievements tab, so newly earned
# GitHub achievements appear in the README gallery within a day. Only commits when
# something changed. Uses the built-in GITHUB_TOKEN; no secrets are required.
name: Achievements gallery

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/achievements.py, .github/workflows/achievements.yml]

permissions:
  contents: write

concurrency:
  group: achievements
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render gallery
        run: python scripts/achievements.py "${{ github.repository_owner }}" assets/achievements.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/achievements.svg; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/achievements.svg
          git commit -m "chore: update achievements gallery"
          git push
